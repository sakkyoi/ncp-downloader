name: Build

on:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: 3.12
    - run: pip install -r requirements.txt
    - uses: Nuitka/Nuitka-Action@main
      if: runner.os == 'Windows'
      with:
        nuitka-version: main
        script-name: main.py
        mode: onefile
        output-file: ncp-${{ matrix.name }}
        output-dir: dist
        lto: yes
        include-module: jinxed.terminfo.vtwin10
    - uses: Nuitka/Nuitka-Action@main
      if: runner.os != 'Windows'
      with:
        nuitka-version: main
        script-name: main.py
        mode: onefile
        output-file: ncp-${{ matrix.name }}
        output-dir: dist
        lto: yes
        disable-cache: true
    - run: ./dist/ncp-${{ matrix.name }} --help
    - run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_ENV
    - uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        name: Release ${{ env.sha_short }}
        tag_name: ${{ env.sha_short }}
        token: ${{ secrets.GITHUB_TOKEN }}
